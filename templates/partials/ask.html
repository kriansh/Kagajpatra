{% load static %}
<section class="ask-section" id="ask" aria-labelledby="ask-heading">
  <div class="container">
    <div class="ask-card">

      <div class="ask-card__header">
        <h2 class="ask-card__title" id="ask-heading">
          <!-- Robot/assistant icon -->
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="10" rx="2"/>
            <path d="M12 11V7"/>
            <circle cx="12" cy="5" r="2"/>
            <path d="M8 15h.01M12 15h.01M16 15h.01"/>
          </svg>
          {{ t.ask_heading }}
        </h2>
        <p class="ask-card__hint">{{ t.mic_hint }}</p>
      </div>

      <form id="ask-form" action="{% url 'assistant:ask_stream' %}" method="post" novalidate>
        {% csrf_token %}
        <div class="ask-row">
          <div class="ask-input-wrap">
            <textarea
              id="ask-input"
              name="question"
              rows="2"
              class="ask-input"
              placeholder="{{ t.ask_placeholder }}"
              aria-label="{{ t.ask_heading }}"
              autocomplete="off"
              spellcheck="false"></textarea>
          </div>

          <div class="ask-actions">
            <!-- Mic button -->
            <button
              type="button"
              class="btn btn--secondary btn--icon"
              id="ask-mic-btn"
              data-voice="ask"
              data-status-target="ask-voice-status"
              data-transcript-target="ask-transcript"
              aria-label="{{ t.mic_hint }}"
              data-state="idle">
              <!-- Mic icon -->
              <svg class="voice-btn__icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M12 2a3 3 0 0 1 3 3v7a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3z"/>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                <line x1="12" x2="12" y1="19" y2="22"/>
              </svg>
            </button>

            <!-- Submit button -->
            <button type="submit" class="btn btn--primary">{{ t.send }}</button>
          </div>
        </div>
      </form>

      <!-- Voice status -->
      <div class="voice-status" id="ask-voice-status" role="status" aria-live="polite"></div>

      <!-- Live transcript -->
      <div class="voice-transcript" id="ask-transcript" aria-live="polite"></div>

      <!-- Thinking / status -->
      <div class="ask-status" id="ask-status" role="status" aria-live="polite"></div>

      <!-- Answer -->
      <div class="answer-card is-hidden" id="answer-card" aria-live="polite">
        <div class="answer-text" id="answer-text"></div>
        <div class="answer-meta">
          <span>{{ t.answer_from }}:</span>
          <span class="provider-badge" id="provider-badge">Gemma</span>
          <button type="button" class="btn btn--ghost btn--sm" id="read-answer-btn">
            <!-- Speaker icon -->
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
              <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
              <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
            </svg>
            {{ t.read_aloud }}
          </button>
        </div>
      </div>

    </div>
  </div>
</section>
